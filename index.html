<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music Playlist Converter</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/github-dark.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <main class="container">
        <div class="page-header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM6.5 11.5L4 8l2.5-3.5h3L12 8l-2.5 3.5h-3Z"/>
                </svg>
                Apple Music Playlist Converter
                <span class="Label" id="version-label">v1.0.0</span>
            </h1>
            <div class="page-description" id="page-description">
                把 Apple Music 导出的歌单转换成其他音乐软件能识别的格式
            </div>
        </div>

        <div class="tabnav">
            <div class="tabnav-tabs">
                <a class="tabnav-tab selected" data-tab="converter">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8A1.5 1.5 0 0 0 3 3v8.25a2.5 2.5 0 0 1 1.5-.25h8Z"/>
                    </svg>
                    Converter
                </a>
                <a class="tabnav-tab" href="https://github.com/ieshishinjin/Apple-Music-Playlist-Converter/issues" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Z"/>
                    </svg>
                    Issues
                </a>
                <a class="tabnav-tab" href="https://github.com/ieshishinjin/Apple-Music-Playlist-Converter/pulls" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 9H3V8h1v1Zm0-3H3v1h1V6Zm0-2v1H3V4h1Zm2 9H4v-1h2v1Zm0-2H4v-1h2v1Zm0-2H4V8h2v1Zm0-2H4V6h2v1Zm0-2H4V4h2v1Zm6 7h-5v-1h5v1Zm0-2h-5v-1h5v1Zm0-2h-5V8h5v1Zm0-2h-5V6h5v1Zm0-2h-5V4h5v1Z"/>
                    </svg>
                    Pull requests
                </a>
            </div>
        </div>

        <div id="converter-panel">
            <div class="Box">
                <div class="Box-header">
                    <div class="Box-title">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25Z"/>
                            <path d="M3.5 6.25c0-.966.784-1.75 1.75-1.75h5.5c.966 0 1.75.784 1.75 1.75v5.5a1.75 1.75 0 0 1-1.75 1.75h-5.5A1.75 1.75 0 0 1 3.5 11.75Zm1.75-.25a.25.25 0 0 0-.25.25v5.5c0 .138.112.25.25.25h5.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25Z"/>
                        </svg>
                        Input
                    </div>
                </div>
                <div class="Box-body">
                    <textarea id="inputText" class="form-control" placeholder="把 Apple Music 复制的歌单粘贴到这里..."></textarea>
                    
                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="pasteExampleBtn">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
                                <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
                            </svg>
                            粘贴示例
                        </button>
                        <button class="btn btn-secondary" id="clearBtn">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M2.75 2.5h10.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5Z"></path>
                                <path d="M6.5 5.75a.75.75 0 0 1 1.5 0v5.5a.75.75 0 0 1-1.5 0v-5.5Zm3.5 0a.75.75 0 0 1 1.5 0v5.5a.75.75 0 0 1-1.5 0v-5.5Z"></path>
                                <path d="M4.75 3v9.5a.25.25 0 0 0 .25.25h6a.25.25 0 0 0 .25-.25V3h-6.5Zm-1.5-1.5h9.5v11c0 .966-.784 1.75-1.75 1.75h-6A1.75 1.75 0 0 1 3.25 12.5v-11Z"></path>
                            </svg>
                            清空
                        </button>
                    </div>
                </div>
            </div>

            <div class="Box">
                <div class="Box-header">
                    <div class="Box-title">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M5.75 1a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 5.75 1Zm4.5 0a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5a.75.75 0 0 1 .75-.75Z"></path>
                            <path d="M3.5 6.5h9V5h-9v1.5Zm0 5h9V10h-9v1.5ZM12.75 3h-9.5A1.75 1.75 0 0 0 1.5 4.75v8.5c0 .966.784 1.75 1.75 1.75h9.5a1.75 1.75 0 0 0 1.75-1.75v-8.5A1.75 1.75 0 0 0 12.75 3Z"></path>
                        </svg>
                        Options
                    </div>
                </div>
                <div class="Box-body">
                    <div class="options-grid">
                        <div class="option-group">
                            <label class="option-label">输出格式</label>
                            <select id="outputFormat" class="form-control">
                                <option value="artist-title">歌手 - 歌名 (推荐)</option>
                                <option value="title-artist">歌名 - 歌手</option>
                                <option value="title-only">仅歌名</option>
                                <option value="artist-only">仅歌手</option>
                                <option value="csv">CSV格式 (歌名,歌手)</option>
                                <option value="m3u">M3U播放列表</option>
                            </select>
                        </div>
                        
                        <div class="option-group">
                            <label class="option-label">处理选项</label>
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="removeDup" checked> 去重
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="trimSpaces" checked> 清理多余空格
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="ignoreHeader" checked> 忽略表头行
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="convert-button-container">
                        <button class="btn btn-primary" id="convertBtn">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm-1.5 0a8 8 0 1 1 16 0 8 8 0 0 1-16 0Zm10.646-2.146a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 0 1 .708-.708L7.5 8.293l2.646-2.647Z"/>
                            </svg>
                            转换歌单
                        </button>
                    </div>
                </div>
            </div>

            <div id="statsBox" class="Box" style="display: none;">
                <div class="Box-header">
                    <div class="Box-title">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M2 1.75C2 .784 2.784 0 3.75 0h8.5C13.216 0 14 .784 14 1.75v12.5A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25ZM7 4a1 1 0 1 1 2 0v6a1 1 0 1 1-2 0V4Zm3 2a1 1 0 1 1 2 0v4a1 1 0 1 1-2 0V6ZM5 9a1 1 0 1 1 2 0v1a1 1 0 1 1-2 0V9Z"/>
                        </svg>
                        Statistics
                    </div>
                </div>
                <div class="Box-body">
                    <div class="stats">
                        <div class="stat">
                            <svg width="16" height="16" viewBox="0 0 16 16">
                                <path d="M2 1.75C2 .784 2.784 0 3.75 0h8.5C13.216 0 14 .784 14 1.75v12.5A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25Z"/>
                                <path d="M8 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm.75 5.75v-4a.75.75 0 0 0-1.5 0v4a.75.75 0 0 0 1.5 0Z"/>
                            </svg>
                            <span class="stat-number" id="songCount">0</span>
                            <span class="stat-label">首歌曲</span>
                        </div>
                        <div class="stat">
                            <svg width="16" height="16" viewBox="0 0 16 16">
                                <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25Z"/>
                                <path d="M6 5a1 1 0 1 1 2 0 1 1 0 0 1-2 0Zm5 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm-4.5 2.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM11 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
                            </svg>
                            <span class="stat-number" id="dupCount">0</span>
                            <span class="stat-label">重复去除</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="outputBox" class="Box" style="display: none;">
                <div class="Box-header">
                    <div class="Box-title">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25Z"/>
                            <path d="M3.5 6.25c0-.966.784-1.75 1.75-1.75h5.5c.966 0 1.75.784 1.75 1.75v5.5a1.75 1.75 0 0 1-1.75 1.75h-5.5A1.75 1.75 0 0 1 3.5 11.75Zm1.75-.25a.25.25 0 0 0-.25.25v5.5c0 .138.112.25.25.25h5.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25Z"/>
                        </svg>
                        Output
                    </div>
                    <div class="labels">
                        <span id="formatLabel" class="Label">歌手 - 歌名</span>
                    </div>
                </div>
                <div class="Box-body">
                    <textarea id="outputText" class="form-control" readonly placeholder="转换后的歌单会显示在这里..."></textarea>
                    
                    <div class="output-actions">
                        <div class="btn-group">
                            <button class="btn btn-primary" id="copyBtn">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
                                    <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
                                </svg>
                                复制结果
                            </button>
                            <button class="btn btn-secondary" id="downloadBtn">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path>
                                    <path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"></path>
                                </svg>
                                下载文件
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="Box-row">
                    <div class="preview-header">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8A1.5 1.5 0 0 0 3 3v8.25a2.5 2.5 0 0 1 1.5-.25h8Z"/>
                        </svg>
                        预览（前10首）
                    </div>
                    <div id="previewContent" class="preview"></div>
                </div>
                
                <div class="Box-footer">
                    ⚡ 纯本地处理 · 你的数据不会离开浏览器
                </div>
            </div>
        </div>

        <div id="flashMessage" class="flash"></div>
    </main>

    <script src="js/converter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
